name: VADPCM no-loop frame diagnostics

on:
  push:
    branches:
      - feature/multilang-dub-30fps
    paths:
      - scripts/multilang/decode_vadpcm_without_loop.py
      - scripts/multilang/test_decode_vadpcm_without_loop.py
      - scripts/multilang/reconstruct_ptbr_audio_from_xex.py
      - .github/workflows/test-vadpcm-no-loop-diagnostics.yml
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test full-frame diagnostic exports with missing loop
        run: python3 -m unittest discover -s scripts/multilang -p 'test_decode_vadpcm_without_loop.py' -v
