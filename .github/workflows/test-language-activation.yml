name: Test Language Activation PPC

on:
  push:
    branches:
      - feature/multilang-dub-30fps
    paths:
      - scripts/multilang/language_activation.py
      - scripts/multilang/test_language_activation.py
      - .github/workflows/test-language-activation.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Emulate PT ES EN pointer activation
        working-directory: scripts/multilang
        run: |
          python3 test_language_activation.py
          python3 - <<'PY'
          from pathlib import Path
          from language_activation import build
          Path("../../language_activation.bin").write_bytes(build())
          PY
          sha256sum ../../language_activation.bin

      - uses: actions/upload-artifact@v4
        with:
          name: sm64-language-activation-tested
          path: language_activation.bin
          if-no-files-found: error
          retention-days: 7
