name: TEST15 prompt patch static tests

on:
  push:
    branches:
      - feature/multilang-dub-30fps
    paths:
      - scripts/multilang/patch_test15_prompt_demo_fix.py
      - scripts/multilang/test_patch_test15_prompt_demo_fix.py
      - .github/workflows/test-test15-prompt-fix.yml
  workflow_dispatch:

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic mapped-PE patch tests (no game binary required)
        run: python3 -m unittest discover -s scripts/multilang -p 'test_patch_test15_prompt_demo_fix.py' -v
