name: TEST9 PPC64 ABI Capability Probe

on:
  push:
    branches:
      - feature/multilang-dub-30fps
    paths:
      - scripts/multilang/probe_test9_ppc64_mode.py
      - .github/workflows/test9-ppc64-abi-probe.yml
  workflow_dispatch:

jobs:
  probe-powerpc64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU emulator
        run: python3 -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Determine whether PPC64 instruction mode is supported and first frame is simulatable
        run: python3 scripts/multilang/probe_test9_ppc64_mode.py
