name: Reconstruct PT-BR audio strict tests

on:
  push:
    branches:
      - feature/multilang-dub-30fps
    paths:
      - scripts/multilang/reconstruct_ptbr_audio_from_xex.py
      - scripts/multilang/test_reconstruct_ptbr_audio_from_xex.py
      - .github/workflows/test-reconstruct-ptbr-audio.yml
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run provenance and VADPCM tests on synthetic data
        run: python3 -m unittest discover -s scripts/multilang -p 'test_reconstruct_ptbr_audio_from_xex.py' -v
