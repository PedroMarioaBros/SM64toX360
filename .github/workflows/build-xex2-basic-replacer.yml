name: Build xex2 Basic Replacer

on:
  push:
    paths:
      - .github/workflows/build-xex2-basic-replacer.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multilang-dub-30fps

      - name: Fetch pinned acceleration
        run: |
          git clone https://github.com/landaire/acceleration.git acceleration
          git -C acceleration checkout 0e7258713d6b1487a741ce8e64d08f079e4bf495

      - name: Apply SM64toX360 Basic rebuild extension
        run: python3 tools/xex2_basic_replacer/patch_acceleration.py

      - name: Build xex2replace
        run: |
          cp -r tools/xex2_basic_replacer /tmp/xex2replace
          sed -i "s|__ACCELERATION_XEX2_PATH__|$GITHUB_WORKSPACE/acceleration/crates/xex2|" /tmp/xex2replace/Cargo.toml
          cargo build --manifest-path /tmp/xex2replace/Cargo.toml --release
          /tmp/xex2replace/target/release/xex2replace 2> xex2replace-help.txt || test $? -eq 2
          sha256sum /tmp/xex2replace/target/release/xex2replace | tee xex2replace-sha256.txt
          git -C acceleration rev-parse HEAD | tee XEX2_BASE_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xex2-basic-replacer-linux
          path: |
            /tmp/xex2replace/target/release/xex2replace
            xex2replace-help.txt
            xex2replace-sha256.txt
            XEX2_BASE_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
